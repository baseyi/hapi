
name: Android Signed Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (must increase)"
        required: true
        default: "1"
        type: string
      version_name:
        description: "Android versionName"
        required: true
        default: "0.30.7"
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    env:
      HAPI_VERSION_CODE: ${{ inputs.version_code }}
      HAPI_VERSION_NAME: ${{ inputs.version_name }}

      HAPI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.HAPI_UPLOAD_KEYSTORE_PASSWORD }}
      HAPI_UPLOAD_KEY_ALIAS: ${{ secrets.HAPI_UPLOAD_KEY_ALIAS }}
      HAPI_UPLOAD_KEY_PASSWORD: ${{ secrets.HAPI_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HAPI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$HAPI_UPLOAD_KEYSTORE_PASSWORD"

          umask 077

          KEYSTORE_PATH="$RUNNER_TEMP/hapi-release.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"

          echo "HAPI_UPLOAD_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run tests and build Release APK
        run: |
          chmod +x ./gradlew

          ./gradlew \
            -PhapiVersionCode="$HAPI_VERSION_CODE" \
            -PhapiVersionName="$HAPI_VERSION_NAME" \
            :core:protocol:test \
            :core:data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --stacktrace

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hapi-release-${{ inputs.version_name }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/hapi-release.jks"
